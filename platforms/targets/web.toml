name = "the browser: the screen's module (no audio host: the sound runs in the worklet's, web_audio)"
status = "kept"            # deprecated
profile = "handheld"

[build]
groups = ["core", "audio", "fx", "ui"]   # (audio: the core names its tables, the drum lanes' notes and the built-in engines; the sound itself runs in the worklet's module)
sources = ["platforms/web/kreisel_web.c"]
